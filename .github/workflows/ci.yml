name: QMK CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container: qmkfm/qmk_cli

    strategy:
      fail-fast: false
      matrix:
        keyboard:
          - ydkb/agar
        keymap:
          - default
          - djcastaldo

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QMK
        run: |
          qmk setup -y

      - name: Compile firmware
        run: |
          qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }}
