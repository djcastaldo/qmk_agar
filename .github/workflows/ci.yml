name: QMK CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        keyboard:
          - ydkb/agar
        keymap:
          - default
          - djcastaldo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QMK + deps
        run: |
          python -m pip install --upgrade pip
          pip install qmk appdirs milc hjson

      - name: Compile firmware
        run: |
          qmk compile -kb ${{ matrix.keyboard }} -km ${{ matrix.keymap }}
